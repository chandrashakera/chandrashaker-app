<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chandrashaker — Apps for Students</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231565c0'/%3E%3Cpath d='M23 10.5 A9 9 0 1 0 23 21.5' stroke='%23ff8f00' stroke-width='6.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Public+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --wall: #eef3fb;
    --wall-shadow: #d7e3f5;
    --steel: #1565c0;
    --icon-stroke: #1565c0;
    --on-steel: #fdf6ea;
    --muted: #c9dcf3;
    --wall-muted: #6784a8;
    --amber: #ff8f00;
    --amber-ink: #241800;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --wall: #0d1b2e;
      --wall-shadow: #081221;
      --steel: #2f6fd6;
      --icon-stroke: #2f6fd6;
      --on-steel: #f5f8fc;
      --muted: #a9c4ec;
      --wall-muted: #8fa8c9;
      --amber: #ffb74d;
      --amber-ink: #241800;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--wall);
    color: var(--on-steel);
    font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 6vw;
  }
  .page {
    width: 100%;
    max-width: 920px;
    display: flex;
    flex-direction: column;
    gap: 1.3rem;
  }
  .bank {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 1.1rem;
  }
  .privacy-link {
    text-align: center;
    font-size: 0.78rem;
    color: var(--wall-muted);
    text-decoration: none;
  }
  .privacy-link:hover { color: var(--steel); text-decoration: underline; }
  a.locker {
    background: var(--steel);
    border-radius: 8px;
    padding: 1.5rem 1.4rem 1.3rem;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08), 0 1px 0 var(--wall-shadow);
    text-decoration: none;
    color: var(--on-steel);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.locker:hover {
    transform: translateY(-2px);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08), 0 6px 14px rgba(0,0,0,0.12);
  }
  .louvers {
    position: absolute;
    top: 1.5rem;
    right: 1.4rem;
    width: 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .louvers span { display: block; height: 2px; background: rgba(0,0,0,0.15); border-radius: 1px; }
  .icon-plate {
    width: 56px;
    height: 56px;
    border-radius: 5px;
    background: var(--wall);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
  }
  .icon-plate svg { width: 30px; height: 30px; stroke: var(--icon-stroke); }
  .locker h3 {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 1.12rem;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    margin: 0;
  }
  .locker p { margin: 0.35rem 0 0; font-size: 0.86rem; color: var(--muted); line-height: 1.5; }
  .locker.soon { opacity: 0.68; }
  .badge {
    position: absolute;
    top: 1.4rem;
    left: 1.4rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--amber-ink);
    background: var(--amber);
    padding: 0.15rem 0.45rem;
    border-radius: 3px;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="bank" id="bank"></div>
    <a class="privacy-link" href="https://apps.chandrashaker.in/privacy.html">Privacy</a>
  </div>

  <script>
    // Add new apps here — each one renders as its own locker tile.
    const apps = [
      {
        name: "Student Achievement Tracker",
        description: "Tracks student achievements",
        url: "https://a.chandrashaker.in",
        icon: `<path d="M6 24 L6 18 M13 24 L13 13 M20 24 L20 9 M27 24 L27 15"/><path d="M20 9 L27 4"/><circle cx="27" cy="4" r="2.4"/>`
      },
      {
        name: "Exam Marks Tracker",
        description: "Records student exam marks",
        url: "https://marks.chandrashaker.in",
        icon: `<rect x="7" y="5" width="18" height="23" rx="1.5"/><path d="M12 3.5 h8 v3 h-8 z"/><path d="M11.5 13 l2.5 2.5 l4-4.5"/><path d="M11.5 20 h9"/>`
      }
    ];

    const bank = document.getElementById("bank");
    apps.forEach(app => {
      const a = document.createElement("a");
      a.className = "locker" + (app.soon ? " soon" : "");
      a.href = app.url;
      a.innerHTML = `
        <div class="louvers"><span></span><span></span><span></span></div>
        ${app.soon ? '<span class="badge">soon</span>' : ""}
        <div class="icon-plate">
          <svg viewBox="0 0 32 32" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">${app.icon}</svg>
        </div>
        <h3>${app.name}</h3>
        <p>${app.description}</p>
      `;
      bank.appendChild(a);
    });
  </script>
</body>
</html>
